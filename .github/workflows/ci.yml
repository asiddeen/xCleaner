name: CI & Apple Silicon Packaging

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build, Test & Package DMG
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show macOS and Swift Information
        run: |
          sw_vers
          uname -m
          swift --version

      - name: Run Test Suite
        run: make test

      - name: Package Distributable DMG
        run: make dmg

      - name: Verify Code Signature
        run: |
          codesign --verify --deep --strict --verbose=2 dist/xCleaner.app
          hdiutil verify dist/xCleaner.dmg

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xCleaner-dmg
          path: |
            dist/xCleaner.dmg
            dist/xCleaner.dmg.sha256
          retention-days: 14

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/xCleaner.dmg
            dist/xCleaner.dmg.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
